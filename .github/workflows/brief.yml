name: SA Macro & Markets Brief

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 06:15 SAST, Monday to Friday
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: ["brief/**", "requirements.txt", ".github/workflows/brief.yml"]

permissions:
  contents: write   # commit the report back to the repo
  models: read      # free AI via GitHub Models

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional email delivery: add these as repository secrets to switch it on.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python -m brief.main

      - name: AI endpoint diagnostics (temporary)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" | head -c 600; echo
            echo "== minimal chat, gpt-4.1-mini"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 900; echo
            echo "== minimal chat, gpt-4o-mini"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 900; echo
          } > data/ai-debug.txt 2>&1 || true

      - name: Save the workbook to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git commit -m "Brief for $(TZ=Africa/Johannesburg date +%Y-%m-%d)" || echo "Nothing new"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: sa-macro-brief
          path: reports/latest.xlsx
          retention-days: 30
