name: SA Macro & Markets Brief

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 06:15 SAST, Monday to Friday
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: ["brief/**", "requirements.txt", ".github/workflows/brief.yml"]

permissions:
  contents: write   # commit the report back to the repo

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the brief
        env:
          # Free AI analyst: add ONE of these as a repository secret (Groq recommended).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional email delivery: add these as repository secrets to switch it on.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python -m brief.main

      - name: Save the workbook to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git commit -m "Brief for $(TZ=Africa/Johannesburg date +%Y-%m-%d)" || echo "Nothing new"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: sa-macro-brief
          path: reports/latest.xlsx
          retention-days: 30
